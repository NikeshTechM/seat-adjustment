version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "sdv-devops-engine/seat-adjustment"
    AWS_DEFAULT_REGION: "us-east-1"
    DDB_TABLE: "sdvDevopsPipelineDashboardDDTable"
    GITHUB_URL: "https://github.com/NikeshTechM/seat-adjustment"
    REPO_NAME: "seat-adjustment"

  secrets-manager:
    DOCKERHUB_USERNAME: dockerhub-credentials:username
    DOCKERHUB_PASSWORD: dockerhub-credentials:password

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Checking AWS CLI..."
      - aws --version || (
          curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip &&
          unzip -q awscliv2.zip &&
          ./aws/install --update
        )
      - echo "Checking Podman..."
      - podman --version || yum install -y podman

  pre_build:
    commands:
      - echo "Login to DockerHub"
      - echo "$DOCKERHUB_PASSWORD" | podman login docker.io --username $DOCKERHUB_USERNAME --password-stdin

      - echo "Login to ECR"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | podman login --username AWS --password-stdin $ECR_REGISTRY

      - BUILD_TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
      - IMAGE_TAG="${BUILD_TIMESTAMP}"
      - FULL_IMAGE_URI="${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${IMAGE_TAG}"

      # ✅ Correct commit id (NO git dependency)
      - COMMIT_ID="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      # 🔹 FETCH REPO STAGE UPDATE
      - |
        aws dynamodb update-item \
          --table-name ${DDB_TABLE} \
          --key '{ "ddid": { "S": "'"${PIPELINE_EXECUTION_ID}"'" } }' \
          --update-expression "
            SET
              FetchRepoStage = :msg,
              FetchRepoStageStatus = :status,
              FetchRepoStageTimestamp = :ts,
              GithubUrl = :giturl,
              RepoName = :reponame,
              AppVersion = :appver,
              #status = :old
          " \
          --expression-attribute-names '{ "#status": "Status" }' \
          --expression-attribute-values '{
            ":msg": { "S": "Fetch Repo successful" },
            ":status": { "S": "Yes" },
            ":ts": { "S": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'" },
            ":giturl": { "S": "'"${GITHUB_URL}"'" },
            ":reponame": { "S": "'"${REPO_NAME}"'" },
            ":appver": { "S": "'"${COMMIT_ID}"'" },
            ":old": { "S": "Old" }
          }'

  build:
    commands:
      - echo "Building container..."
      - podman build -t ${FULL_IMAGE_URI} -f Dockerfile .

      # 🔹 BUILD STAGE UPDATE
      - |
        aws dynamodb update-item \
          --table-name ${DDB_TABLE} \
          --key '{ "ddid": { "S": "'"${PIPELINE_EXECUTION_ID}"'" } }' \
          --update-expression "
            SET
              BuildContainerStage = :msg,
              BuildContainerStageStatus = :status,
              BuildContainerStageTimestamp = :ts
          " \
          --expression-attribute-values '{
            ":msg": { "S": "Successfully built image: '"${FULL_IMAGE_URI}"'" },
            ":status": { "S": "Yes" },
            ":ts": { "S": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'" }
          }'

  post_build:
    commands:
      # 🔴 FAILURE HANDLER
      - |
        trap '
          aws dynamodb update-item \
            --table-name ${DDB_TABLE} \
            --key "{ \"ddid\": { \"S\": \"${PIPELINE_EXECUTION_ID}\" } }" \
            --update-expression "
              SET
                UpdateRepoStatus = :fail,
                #status = :old
            " \
            --expression-attribute-names "{\"#status\":\"Status\"}" \
            --expression-attribute-values "{
              \":fail\": {\"S\":\"PushFailed\"},
              \":old\": {\"S\":\"Old\"}
            }"
        ' ERR

      - echo "Running tests..."
      - echo "Testing Completed"

      # 🔹 TEST STAGE UPDATE
      - |
        aws dynamodb update-item \
          --table-name ${DDB_TABLE} \
          --key '{ "ddid": { "S": "'"${PIPELINE_EXECUTION_ID}"'" } }' \
          --update-expression "
            SET
              TestAndValidateStage = :msg,
              TestAndValidateStageStatus = :status,
              TestAndValidateStageTimestamp = :ts
          " \
          --expression-attribute-values '{
            ":msg": { "S": "Testing Completed" },
            ":status": { "S": "Yes" },
            ":ts": { "S": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'" }
          }'

      - echo "Pushing image to ECR..."
      - podman push ${FULL_IMAGE_URI}

      # 🔹 PUSH SUCCESS UPDATE
      - |
        aws dynamodb update-item \
          --table-name ${DDB_TABLE} \
          --key '{ "ddid": { "S": "'"${PIPELINE_EXECUTION_ID}"'" } }' \
          --update-expression "
            SET
              PushToQuayStage = :msg,
              PushToQuayStageTimestamp = :ts,
              UpdateRepoStatus = :success,
              #status = :old
          " \
          --expression-attribute-names '{ "#status": "Status" }' \
          --expression-attribute-values '{
            ":msg": { "S": "Push Completed" },
            ":ts": { "S": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'" },
            ":success": { "S": "PushSuccess" },
            ":old": { "S": "Old" }
          }'

artifacts:
  files:
    - Dockerfile
  name: build-artifacts-${CODEBUILD_BUILD_ID}
  discard-paths: yes
