version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "sdv-devops-engine/seat-adjustment"
    AWS_DEFAULT_REGION: "us-east-1"
    DDB_TABLE: "sdvDevopsPipelineDashboardDDTable"
    PIPELINE_EXECUTION_ID: "#{codepipeline.PipelineExecutionId}"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Checking AWS CLI..."
      - aws --version || (curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip && unzip -q awscliv2.zip && ./aws/install --update)
      - echo "Checking Podman..."
      - podman --version || yum install -y podman

  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | podman login --username AWS --password-stdin ${ECR_REGISTRY}
      - BUILD_TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
      - IMAGE_TAG=${BUILD_TIMESTAMP}
      - FULL_IMAGE_URI=${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${IMAGE_TAG}
      - echo "Image URI: ${FULL_IMAGE_URI}"

  build:
    commands:
      - echo "Building image..."
      - podman build -t ${FULL_IMAGE_URI} -f Dockerfile .

      - aws dynamodb update-item --table-name ${DDB_TABLE} --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" --update-expression "SET BuildContainerStage=:m, BuildContainerStageStatus=:s, BuildContainerStageTimestamp=:t" --expression-attribute-values "{\":m\":{\"S\":\"Image built: ${FULL_IMAGE_URI}\"},\":s\":{\"S\":\"Yes\"},\":t\":{\"S\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}}"

  post_build:
    commands:
      - echo "Running tests..."
      - podman build -f Dockerfile.test -t test-image:${IMAGE_TAG} .
      - podman run --rm test-image:${IMAGE_TAG}

      - aws dynamodb update-item --table-name ${DDB_TABLE} --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" --update-expression "SET TestAndValidateStage=:m, TestAndValidateStageStatus=:s, TestAndValidateStageTimestamp=:t" --expression-attribute-values "{\":m\":{\"S\":\"Tests passed\"},\":s\":{\"S\":\"Yes\"},\":t\":{\"S\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}}"

      - echo "Pushing image to ECR..."
      - podman push ${FULL_IMAGE_URI}

      - aws dynamodb update-item --table-name ${DDB_TABLE} --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" --update-expression "SET PushToECRStage=:m, PushToECRStageTimestamp=:t, #st=:fs" --expression-attribute-names "{\"#st\":\"Status\"}" --expression-attribute-values "{\":m\":{\"S\":\"Push completed\"},\":t\":{\"S\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"},\":fs\":{\"S\":\"Old\"}}"

artifacts:
  files:
    - Dockerfile
  discard-paths: yes
