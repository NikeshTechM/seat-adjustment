version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "sdv-devops-engine/seat-adjustment"
    AWS_DEFAULT_REGION: "us-east-1"
    DDB_TABLE: "sdvDevopsPipelineDashboardDDTable"
    REPO_NAME: "seat-adjustment"
    GITHUB_URL: "https://github.com/NikeshTechM/seat-adjustment"

  secrets-manager:
    DOCKERHUB_USERNAME: dockerhub-credentials:username
    DOCKERHUB_PASSWORD: dockerhub-credentials:password

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - set -e
      - aws --version
      - podman --version || yum install -y podman

  pre_build:
    commands:
      - set -e
      - echo "🔐 Login to DockerHub"
      - echo "$DOCKERHUB_PASSWORD" | podman login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - echo "🔐 Login to ECR"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | podman login --username AWS --password-stdin ${ECR_REGISTRY}

      - BUILD_TIME=$(date -u +"%Y%m%d%H%M%S")   # ✅ No dash in tag
      - IMAGE_TAG=${BUILD_TIME}
      - FULL_IMAGE_URI=${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${IMAGE_TAG}

      - COMMIT_ID=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

      - echo "DDID=${PIPELINE_EXECUTION_ID}"
      - echo "COMMIT_ID=${COMMIT_ID}"

      # 🔹 Fetch Repo Stage → Status = New
      - |
        aws dynamodb update-item \
          --table-name "${DDB_TABLE}" \
          --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" \
          --update-expression "SET AppVersion=:a, FetchRepoStage=:f, FetchRepoStageStatus=:s, FetchRepoStageTimestamp=:t, RepoName=:r, GithubUrl=:g, #st=:n" \
          --expression-attribute-names '{"#st":"Status"}' \
          --expression-attribute-values "{
            \":a\":{\"S\":\"${COMMIT_ID}\"},
            \":f\":{\"S\":\"Fetch Repo successful\"},
            \":s\":{\"S\":\"Yes\"},
            \":t\":{\"S\":\"${CURRENT_TIME}\"},
            \":r\":{\"S\":\"${REPO_NAME}\"},
            \":g\":{\"S\":\"${GITHUB_URL}\"},
            \":n\":{\"S\":\"New\"}
          }"

  build:
    commands:
      - set -e
      - echo "🏗️ Building image"
      - |
        podman build \
          --no-cache \
          --build-arg BUILD_TIME=${BUILD_TIME} \
          --build-arg COMMIT_ID=${COMMIT_ID} \
          -t ${FULL_IMAGE_URI} .

      # 🔹 Update Build Stage in DynamoDB
      - |
        CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        aws dynamodb update-item \
          --table-name "${DDB_TABLE}" \
          --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" \
          --update-expression "SET BuildContainerStage=:m, BuildContainerStageStatus=:s, BuildContainerStageTimestamp=:t" \
          --expression-attribute-values "{
            \":m\":{\"S\":\"Container built successfully\"},
            \":s\":{\"S\":\"Yes\"},
            \":t\":{\"S\":\"${CURRENT_TIME}\"}
          }"

  post_build:
    commands:
      - set -e

      # 🔴 FAILURE HANDLER
      - |
        trap '
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          aws dynamodb update-item \
            --table-name "'"${DDB_TABLE}"'" \
            --key "{\"ddid\":{\"S\":\"'"${PIPELINE_EXECUTION_ID}"'\"}}" \
            --update-expression "SET UpdateRepoStatus=:f, #st=:o" \
            --expression-attribute-names "{\"#st\":\"Status\"}" \
            --expression-attribute-values "{\"\\\":f\\\":{\\\"S\\\":\\\"PushFailed\\\"},\\\":o\\\":{\\\"S\\\":\\\"Old\\\"}}"
        ' ERR

      - echo "🧪 Running tests"
      - |
        CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        aws dynamodb update-item \
          --table-name "${DDB_TABLE}" \
          --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" \
          --update-expression "SET TestAndValidateStage=:m, TestAndValidateStageStatus=:s, TestAndValidateStageTimestamp=:t" \
          --expression-attribute-values "{
            \":m\":{\"S\":\"Testing completed successfully\"},
            \":s\":{\"S\":\"Yes\"},
            \":t\":{\"S\":\"${CURRENT_TIME}\"}
          }"

      - echo "📤 Pushing image"
      - podman push ${FULL_IMAGE_URI}

      # 🔹 PUSH SUCCESS → Update all push-related fields
      - |
        CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        aws dynamodb update-item \
          --table-name "${DDB_TABLE}" \
          --key "{\"ddid\":{\"S\":\"${PIPELINE_EXECUTION_ID}\"}}" \
          --update-expression "SET PushToQuayStage=:p, PushToQuayStageStatus=:ps, PushToQuayStageTimestamp=:t, UpdateRepoStatus=:u, #st=:o" \
          --expression-attribute-names '{"#st":"Status"}' \
          --expression-attribute-values "{
            \":p\":{\"S\":\"Push Completed Successfully\"},
            \":ps\":{\"S\":\"Yes\"},
            \":t\":{\"S\":\"${CURRENT_TIME}\"},
            \":u\":{\"S\":\"Completed\"},
            \":o\":{\"S\":\"Old\"}
          }"

artifacts:
  files:
    - Dockerfile
  discard-paths: yes
