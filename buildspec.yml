version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "sdv-devops-engine/seat-adjustment"
    AWS_DEFAULT_REGION: "us-east-1"
    DDB_TABLE: "sdvDevopsPipelineDashboardDDTable"
    DDID: ""  # Injected from CodePipeline #{FetchStage.ddid}

  secrets-manager:
    DOCKERHUB_USERNAME: dockerhub-credentials:username
    DOCKERHUB_PASSWORD: dockerhub-credentials:password

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Checking AWS CLI..."
      - aws --version || (curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip && unzip -q awscliv2.zip && ./aws/install --update)
      - echo "Checking Podman..."
      - podman --version || yum install -y podman

  pre_build:
    commands:
      - echo "Using DDID=${DDID}"
      - echo "Login to DockerHub"
      - echo "$DOCKERHUB_PASSWORD" | podman login docker.io --username $DOCKERHUB_USERNAME --password-stdin
      - echo "Login to ECR"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | podman login --username AWS --password-stdin
      - BUILD_TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
      - IMAGE_TAG="${BUILD_TIMESTAMP}"
      - FULL_IMAGE_URI="${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
      - echo "Full Image URI: $FULL_IMAGE_URI"

  build:
    commands:
      - echo "Building container..."
      - podman build -t "$FULL_IMAGE_URI" -f Dockerfile .
      - echo "Updating DynamoDB Build Stage..."
      - |
        aws dynamodb update-item \
          --table-name "$DDB_TABLE" \
          --key "{\"ddid\": {\"S\": \"$DDID\"}}" \
          --update-expression "SET BuildContainerStage = :msg, BuildContainerStageStatus = :status, BuildContainerStageTimestamp = :ts" \
          --expression-attribute-values "{\"\":msg\":{\"S\":\"Successfully built new image: $FULL_IMAGE_URI\"},\":status\":{\"S\":\"Yes\"},\":ts\":{\"S\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"

  post_build:
    commands:
      - echo "Running tests..."
      - echo "Testing Completed"
      - echo "Updating DynamoDB Test Stage..."
      - |
        aws dynamodb update-item \
          --table-name "$DDB_TABLE" \
          --key "{\"ddid\": {\"S\": \"$DDID\"}}" \
          --update-expression "SET TestAndValidateStage = :msg, TestAndValidateStageStatus = :status, TestAndValidateStageTimestamp = :ts" \
          --expression-attribute-values "{\":msg\":{\"S\":\"Testing Completed\"},\":status\":{\"S\":\"Yes\"},\":ts\":{\"S\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
      - echo "Pushing image to ECR..."
      - podman push "$FULL_IMAGE_URI"
      - echo "Updating DynamoDB Push Stage..."
      - |
        aws dynamodb update-item \
          --table-name "$DDB_TABLE" \
          --key "{\"ddid\": {\"S\": \"$DDID\"}}" \
          --update-expression "SET PushToQuayStage = :pushmsg, PushToQuayStageTimestamp = :ts, #status = :finalstatus" \
          --expression-attribute-names '{"#status":"Status"}' \
          --expression-attribute-values "{\":pushmsg\":{\"S\":\"Push Completed\"},\":ts\":{\"S\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"},\":finalstatus\":{\"S\":\"Old\"}}"

artifacts:
  files:
    - Dockerfile
  name: build-artifacts-${CODEBUILD_BUILD_ID}
  discard-paths: yes
