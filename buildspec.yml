version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "sdv-devops-engine/seat-adjustment"
    AWS_DEFAULT_REGION: "us-east-1"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
        podman login --username AWS --password-stdin $ECR_REGISTRY

      - echo Generating timestamp tag...
      - BUILD_TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
      - IMAGE_TAG="github-${BUILD_TIMESTAMP}"
      - FULL_IMAGE_URI="${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
      - echo "Image will be tagged as: ${FULL_IMAGE_URI}"

  build:
    commands:
      - echo Building Podman container image for linux/arm64 using Dockerfile...
      - podman build \
          --platform linux/arm64 \
          --arch arm64 \
          --label "org.label-schema.build-date=${BUILD_TIMESTAMP}" \
          --label "com.github.build-date=${BUILD_TIMESTAMP}" \
          --label "org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          -t $FULL_IMAGE_URI \
          -f Dockerfile .

  post_build:
    commands:
      - echo Pushing image to ECR...
      - podman push $FULL_IMAGE_URI

      - echo "Build and push completed successfully!"
      - echo "Image available at: ${FULL_IMAGE_URI}"
      - echo "Label applied: com.github.build-date=${BUILD_TIMESTAMP}"

artifacts:
  files:
    - Dockerfile
  name: build-artifacts-${CODEBUILD_BUILD_ID}
  discard-paths: yes
